            font-weight: 500;

            border: 1px solid rgba(56, 189, 248, 0.25);
            font-size: 10px;
            padding: 1px 4px;
            border-radius: 3px;
            white-space: nowrap;

            border: 1px solid rgba(244, 63, 94, 0.25);
            font-size: 10px;
            padding: 1px 4px;
            border-radius: 3px;
            white-space: nowrap;

            border: 1px solid rgba(168, 85, 247, 0.25);
            font-size: 10px;
            padding: 1px 4px;
            border-radius: 3px;
            white-space: nowrap;

            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            color: #94a3b8;
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            white-space: nowrap;

        .item-id-badge:hover {
            color: #60a5fa;
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .ctrl-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border);
            color: #fff;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 500;

            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;

            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow-x: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            max-height: 760px;

        .v2-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            table-layout: fixed; /* 严格固定列宽，支持拖拽 */
            min-width: 1560px;
        }
        .v2-table th {
            position: sticky;
            top: 0;
            background: #131b29;
            color: var(--text-sub);
            padding: 8px 10px;
            text-align: left;
            border-bottom: 2px solid var(--border-light);
            border-right: 1px solid rgba(43, 56, 78, 0.4);
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            z-index: 10;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            position: relative; /* 供列宽调节手柄定位 */

        .v2-table th:hover {
            color: #fff;
            background: #1a2538;
        }

            padding: 6px 10px;
            border-bottom: 1px solid rgba(43, 56, 78, 0.5);
            border-right: 1px solid rgba(43, 56, 78, 0.3);
            vertical-align: middle;
            white-space: nowrap; /* 核心：严格单行不换行 */

            text-overflow: ellipsis;
            height: 38px;

        .v2-table tr:hover {
            background: rgba(30, 41, 59, 0.6);

            right: 0;

                            ${s.marketing_text.length ? `<span class="tag-mkt" title="营销促销: ${s.marketing_text.join('、')}">🎁${s.marketing_text[0]}</span>` : ''}
                            ${(s.selling_points.length + s.marketing_text.length > 2) ? `<span style="font-size: 10px; color: var(--text-dim);" title="共有 ${s.selling_points.length + s.marketing_text.length} 项卖点">+${s.selling_points.length + s.marketing_text.length - 2}</span>` : ''}
                            <button class="action-btn" style="font-size: 10px; padding: 1px 5px; height: 18px; line-height: 16px; margin-left: auto;" onclick="openOcrModal('${s.id}')">详情</button>
                        </div>
                    `;
                } else {
                    // 展开模式
                    categorizedTextHtml = `
                        <div style="display: flex; align-items: center; gap: 4px; overflow: hidden;">
                            ${s.selling_points.slice(0, 2).map(t => `<span class="tag-sp" title="${t}">🎯${t}</span>`).join('')}
                            ${s.marketing_text.slice(0, 2).map(t => `<span class="tag-mkt" title="${t}">🎁${t}</span>`).join('')}
                            <button class="action-btn" style="font-size: 10px; padding: 1px 5px; height: 18px; line-height: 16px; margin-left: auto;" onclick="openOcrModal('${s.id}')">详情</button>
                        </div>
                    `;
                }

                return `
                    <tr>
                        <td style="color: var(--text-dim); text-align: center; font-weight: 600;">#${idx + 1}</td>
                        
                        <!-- 品牌 / 店铺 -->
                        <td title="${s.shop}">
                            <b style="color: #fff;">${s.shop}</b>
                        </td>

                        <!-- 商品ID (带一键复制) -->
                        <td>
                            <span class="item-id-badge" onclick="copyItemId('${s.itemId}', event)" title="点击复制商品ID">
                                📋 ${s.itemId}
                            </span>
                        </td>

                        <!-- 所属商品 (主图与标题) -->
                        <td title="${s.prod_title}">
                            <div style="display: flex; align-items: center; gap: 5px; overflow: hidden;">
                                <img src="${s.prod_img}" style="width: 20px; height: 20px; border-radius: 3px; object-fit: cover; flex-shrink: 0;" onerror="this.src='https://img.alicdn.com/bao/uploaded/i2/item_pic.jpg'">
                                <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${s.prod_title}</span>
                            </div>
                        </td>

                        <!-- SKU 规格名称 -->
                        <td title="${s.sku_name}">
                            <span style="color: #f1f5f9; font-weight: 500;">${s.sku_name}</span>
                        </td>

                        <!-- 厚度 -->
                        <td>
                            ${s.height ? `<span class="badge badge-height">${s.height}cm</span>` : '<span style="color: var(--text-dim);">-</span>'}
                        </td>

                        <!-- 券后到手价 -->
                        <td>
                            <span class="badge-price">¥${s.price}</span>
                        </td>

                        <!-- 价格分布 MiniBar -->
                        <td>
                            <div style="display: flex; align-items: center; gap: 3px;">
                                <div class="v2-price-bar-box" title="在全网前 ${pct}% 价格档位">
                                    <div class="v2-price-bar-fill" style="width: ${Math.max(8, pct)}%;"></div>
                                </div>
                                <span style="font-size: 10px; color: var(--text-dim);">${pct}%</span>
                            </div>
                        </td>

                        <!-- 厘米单价 -->
                        <td>
                            ${s.unit_price ? `<span class="badge-unit">¥${s.unit_price}</span>` : '<span style="color: var(--text-dim);">-</span>'}
                        </td>

                        <!-- 主图标价与引流度 (单行) -->
                        <td>
                            ${imgPriceHtml}
                        </td>

                        <!-- 主图分类文字 (单行) -->
                        <td>
                            ${categorizedTextHtml}
                        </td>

                        <!-- 优惠幅度 -->
                        <td>
                            ${s.discount > 0 ? `<span style="color: #f87171; font-weight: 600;">-${s.discount}%</span> <span style="text-decoration: line-through; color: var(--text-dim); font-size: 10px;">¥${s.orig}</span>` : '<span style="color: var(--text-dim);">-</span>'}
                        </td>

                        <!-- 类型 -->
                        <td>
                            <span class="badge ${s.source === 'company' ? 'badge-company' : 'badge-market'}">${s.source === 'company' ? '自营' : '大盘'}</span>
                        </td>

                        <!-- 天猫直达 -->
                        <td>
                            <a href="${s.prod_link}" target="_blank" class="action-btn action-btn-primary" style="font-size: 11px; padding: 2px 7px;">天猫 ↗</a>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // =========================================================================
        // 自定义列宽调节引擎 (可左右拖拽表头边缘 + localStorage 记住宽度)
        // =========================================================================
        function makeTableResizable(tableId) {
            const table = document.getElementById(tableId);
            if (!table) return;
            const ths = table.querySelectorAll('thead th');

            ths.forEach((th, i) => {
                // 移除已有手柄
                const old = th.querySelector('.col-resizer');
                if (old) old.remove();

                const resizer = document.createElement('div');
                resizer.className = 'col-resizer';
                th.appendChild(resizer);

                let startX, startWidth;

                resizer.addEventListener('mousedown', function(e) {
                    e.stopPropagation();
                    e.preventDefault();
                    resizer.classList.add('is-resizing');
                    startX = e.clientX;
                    startWidth = th.offsetWidth;
                    document.body.style.cursor = 'col-resize';
                    document.body.style.userSelect = 'none';

                    function onMouseMove(e) {
                        const diff = e.clientX - startX;
                        const newW = Math.max(45, startWidth + diff);
                        th.style.width = newW + 'px';
                    }

                    function onMouseUp() {
                        resizer.classList.remove('is-resizing');
                        document.removeEventListener('mousemove', onMouseMove);
                        document.removeEventListener('mouseup', onMouseUp);
                        document.body.style.cursor = '';
                        document.body.style.userSelect = '';
                        saveColumnWidths();
                    }

                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                });
            });
        }

        function saveColumnWidths() {
            const ths = document.querySelectorAll('#v2-table thead th');
            const widths = Array.from(ths).map(th => th.style.width || (th.offsetWidth + 'px'));
            localStorage.setItem('sku_table_widths_v2', JSON.stringify(widths));
        }

        function restoreColumnWidths() {
            try {
                const saved = JSON.parse(localStorage.getItem('sku_table_widths_v2'));
                if (Array.isArray(saved)) {
                    const ths = document.querySelectorAll('#v2-table thead th');
                    ths.forEach((th, i) => {
                        if (saved[i]) {
                            th.style.width = saved[i];
                        }
                    });
                }
            } catch(e) {}
        }

        function resetColumnWidths() {
            localStorage.removeItem('sku_table_widths_v2');
            const defaultWidths = [
                '55px', '140px', '125px', '180px', '250px', 
                '75px', '95px', '110px', '90px', '160px', 
                '200px', '110px', '65px', '75px'
            ];
            const ths = document.querySelectorAll('#v2-table thead th');
            ths.forEach((th, i) => {
                if (defaultWidths[i]) th.style.width = defaultWidths[i];
            });
        }

        // 初始化
        restoreColumnWidths();
        renderView2();
        makeTableResizable('v2-table');
    </script>
</body>
</html>
